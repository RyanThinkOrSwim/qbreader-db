name: Build QBReader SQLite

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DRIVE_FOLDER: https://drive.google.com/drive/folders/184vCqGAVqUt0G7-K2jG5MH7e2Qm3GzYp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download QBReader dumps from Google Drive
        run: |
          pip install gdown
          python scripts/download_dumps.py --folder "$DRIVE_FOLDER" --out qbdump

      - name: Build database
        run: |
          VERSION=$(date -u +%Y-%m-%d)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python scripts/build_db.py --dump-dir qbdump --out dist --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/db-$VERSION"

      - name: Build lite database
        run: |
          python scripts/build_db.py --dump-dir qbdump --out dist --version "$VERSION" --variant lite \
            --base-url "https://github.com/${{ github.repository }}/releases/download/db-$VERSION"

      - name: Skip if data is unchanged
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(jq -r .sourceSha256 dist/manifest.json)
          OLD=$(gh release download --pattern manifest.json --output - 2>/dev/null | jq -r '.sourceSha256 // empty' || true)
          HAS_LITE=$(gh release view --json assets --jq '[.assets[].name] | index("manifest-lite.json") != null' 2>/dev/null || echo false)
          CHANGED=true
          if [ "$NEW" = "$OLD" ] && [ "$HAS_LITE" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then CHANGED=false; fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "source old=$OLD new=$NEW has_lite=$HAS_LITE changed=$CHANGED"

      - name: Publish GitHub Release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/qbreader.sqlite.xz dist/manifest.json dist/qbreader-lite.sqlite.xz dist/manifest-lite.json"
          if gh release view "db-$VERSION" >/dev/null 2>&1; then
            gh release upload "db-$VERSION" $FILES --clobber
            exit 0
          fi
          gh release create "db-$VERSION" $FILES \
            --title "QBReader database $VERSION" \
            --notes "$(jq -r '"Tossups: \(.counts.tossups)  Bonuses: \(.counts.bonuses)  Sets: \(.counts.sets)  Full download: \(.compressedSize/1048576|floor) MB"' dist/manifest.json)  Lite download: $(jq -r '.compressedSize/1048576|floor' dist/manifest-lite.json) MB" \
            --latest
